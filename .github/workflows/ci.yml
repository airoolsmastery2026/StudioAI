name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: studioai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: LIVE path hardening gate
        run: node scripts/live-path-gate.mjs
      - name: Build
        env:
          GEMINI_API_KEY: test-key
          BOT_DANG_BAI_WORKER_URL: http://127.0.0.1:8794
          BOT_DANG_BAI_WORKER_TOKEN: test-worker-token
        run: npm run build
